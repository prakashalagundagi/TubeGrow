<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Page - TubeGrow</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .test-section { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .btn { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; background: #e9ecef; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>TubeGrow Button Test Page</h1>
    
    <div class="test-section">
        <h2>Navigation Buttons Test</h2>
        <button class="btn" onclick="testNavigation('home')">Home</button>
        <button class="btn" onclick="testNavigation('tools')">Tools</button>
        <button class="btn" onclick="testNavigation('login')">Login</button>
        <button class="btn" onclick="testNavigation('register')">Register</button>
        <div id="navResult" class="result">Click buttons to test navigation</div>
    </div>
    
    <div class="test-section">
        <h2>Hero Buttons Test</h2>
        <button class="btn" onclick="testHero('start')">Start Growing</button>
        <button class="btn" onclick="testHero('explore')">Explore Tools</button>
        <div id="heroResult" class="result">Click buttons to test hero actions</div>
    </div>
    
    <div class="test-section">
        <h2>Auth Buttons Test</h2>
        <button class="btn" onclick="testAuth('login')">Login Test</button>
        <button class="btn" onclick="testAuth('register')">Register Test</button>
        <div id="authResult" class="result">Click buttons to test authentication</div>
    </div>

    <script>
        function testNavigation(page) {
            console.log('Navigation test:', page);
            document.getElementById('navResult').innerHTML = '✅ Navigation to ' + page + ' works!';
            
            // Actually navigate
            if (page === 'home') window.location.href = 'index.html';
            if (page === 'tools') window.location.href = 'tools.html';
            if (page === 'login') window.location.href = 'login.html';
            if (page === 'register') window.location.href = 'register.html';
        }
        
        function testHero(action) {
            console.log('Hero test:', action);
            document.getElementById('heroResult').innerHTML = '✅ Hero button ' + action + ' works!';
            
            if (action === 'start') window.location.href = 'dashboard.html';
            if (action === 'explore') window.location.href = 'tools.html';
        }
        
        function testAuth(action) {
            console.log('Auth test:', action);
            document.getElementById('authResult').innerHTML = '✅ Auth button ' + action + ' works!';
            
            if (action === 'login') window.location.href = 'login.html';
            if (action === 'register') window.location.href = 'register.html';
        }
        
        console.log('Test page loaded - all buttons should work');
    </script>
</body>
</html>
